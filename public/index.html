<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Monitoring Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header span { font-size: 0.8rem; color: #a0aec0; }

    .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem; }

    /* Stats cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: #fff;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .stat-card .label { font-size: 0.75rem; color: #718096; text-transform: uppercase; letter-spacing: .05em; }
    .stat-card .value { font-size: 1.75rem; font-weight: 700; color: #1a1a2e; margin-top: .25rem; }

    /* Two-column layout */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
    @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .card h2 { font-size: 0.9rem; font-weight: 600; color: #4a5568; margin-bottom: 1rem; }

    /* Bar chart */
    .bar-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 0.82rem; }
    .bar-row .bar-label { width: 120px; text-align: right; color: #4a5568; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; background: #edf2f7; border-radius: 4px; height: 18px; }
    .bar-fill { background: #4f46e5; border-radius: 4px; height: 100%; transition: width .4s; }
    .bar-count { width: 40px; color: #2d3748; font-weight: 600; }

    /* Search */
    .search-row {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .search-row input, .search-row select {
      padding: 0.45rem 0.75rem;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      flex: 1;
      min-width: 120px;
    }
    .search-row input:focus, .search-row select:focus { border-color: #4f46e5; }
    .search-row button {
      padding: 0.45rem 1rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .search-row button:hover { background: #4338ca; }

    /* Mentions list */
    .mention-item {
      border-bottom: 1px solid #edf2f7;
      padding: 0.85rem 0;
    }
    .mention-item:last-child { border-bottom: none; }
    .mention-meta { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.3rem; }
    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
      background: #e0e7ff;
      color: #3730a3;
      text-transform: uppercase;
    }
    .mention-date { font-size: 0.72rem; color: #a0aec0; }
    .mention-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.2rem; }
    .mention-title a { color: #1a1a2e; text-decoration: none; }
    .mention-title a:hover { text-decoration: underline; }
    .mention-content { font-size: 0.82rem; color: #4a5568; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .mention-eng { font-size: 0.75rem; color: #718096; margin-top: 0.25rem; }

    .pagination { display: flex; gap: 0.5rem; align-items: center; margin-top: 1rem; font-size: 0.85rem; }
    .pagination button {
      padding: 0.35rem 0.75rem;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    .pagination button:disabled { opacity: .4; cursor: default; }
    .pagination button:not(:disabled):hover { background: #edf2f7; }
    .pagination .page-info { color: #718096; }

    .empty { color: #a0aec0; font-size: 0.85rem; padding: 1rem 0; text-align: center; }
    .loading { color: #a0aec0; font-size: 0.85rem; text-align: center; padding: 1rem; }
  </style>
</head>
<body>

<header>
  <h1>📡 Media Monitoring</h1>
  <span>Dashboard</span>
</header>

<div class="container">

  <!-- Summary cards -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">Total Mentions</div>
      <div class="value" id="total-count">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Sources</div>
      <div class="value" id="source-count">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Days Covered</div>
      <div class="value" id="day-count">—</div>
    </div>
  </div>

  <!-- Charts -->
  <div class="two-col">
    <div class="card">
      <h2>Mentions by Source</h2>
      <div id="source-chart"><div class="loading">Loading…</div></div>
    </div>
    <div class="card">
      <h2>Mentions by Day</h2>
      <div id="day-chart"><div class="loading">Loading…</div></div>
    </div>
  </div>

  <!-- Mentions list -->
  <div class="card">
    <h2>Mentions</h2>

    <div class="search-row">
      <input id="q-input"      type="text"   placeholder="Search keyword…"      onkeydown="if(event.key==='Enter') search()" />
      <input id="source-input" type="text"   placeholder="Source (e.g. twitter)" onkeydown="if(event.key==='Enter') search()" />
      <input id="from-input"   type="date"   onchange="search()" />
      <input id="to-input"     type="date"   onchange="search()" />
      <button onclick="search()">Search</button>
      <button onclick="reset()" style="background:#718096;">Reset</button>
    </div>

    <div id="mentions-list"><div class="loading">Loading…</div></div>

    <div class="pagination">
      <button id="prev-btn" onclick="prevPage()" disabled>← Prev</button>
      <span class="page-info" id="page-info"></span>
      <button id="next-btn" onclick="nextPage()" disabled>Next →</button>
    </div>
  </div>

</div>

<script>
  const LIMIT = 10;
  let offset = 0;
  let totalMentions = 0;
  let currentParams = {};

  // ── Stats ────────────────────────────────────────────────────────────────

  async function loadStats() {
    const [srcRes, dayRes] = await Promise.all([
      fetch('/mentions/stats?group_by=source').then(r => r.json()),
      fetch('/mentions/stats?group_by=day').then(r => r.json()),
    ]);

    // Summary cards
    const totalSrc = srcRes.data.reduce((s, r) => s + Number(r.count), 0);
    document.getElementById('total-count').textContent = totalSrc;
    document.getElementById('source-count').textContent = srcRes.data.length;
    document.getElementById('day-count').textContent = dayRes.data.length;

    // Source bar chart
    renderBarChart('source-chart', srcRes.data, 'source');

    // Day bar chart
    renderBarChart('day-chart', dayRes.data.slice(0, 10), 'day');
  }

  function renderBarChart(containerId, data, labelKey) {
    const el = document.getElementById(containerId);
    if (!data.length) { el.innerHTML = '<div class="empty">No data</div>'; return; }

    const max = Math.max(...data.map(d => Number(d.count)));
    el.innerHTML = data.map(d => {
      const pct = max ? (Number(d.count) / max * 100).toFixed(1) : 0;
      const label = labelKey === 'day'
        ? new Date(d[labelKey]).toLocaleDateString('en-MY', { month: 'short', day: 'numeric' })
        : d[labelKey];
      return `
        <div class="bar-row">
          <div class="bar-label" title="${d[labelKey]}">${label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="bar-count">${d.count}</div>
        </div>`;
    }).join('');
  }

  // ── Mentions list ─────────────────────────────────────────────────────────

  async function loadMentions(params = {}) {
    currentParams = params;
    const qs = new URLSearchParams({ limit: LIMIT, offset, ...params });
    const res = await fetch(`/mentions?${qs}`).then(r => r.json());

    totalMentions = res.total;
    renderMentions(res.data);
    renderPagination(res.total);
  }

  function renderMentions(data) {
    const el = document.getElementById('mentions-list');
    if (!data.length) { el.innerHTML = '<div class="empty">No mentions found.</div>'; return; }

    el.innerHTML = data.map(m => {
      const date = m.published_at
        ? new Date(m.published_at).toLocaleString('en-MY', { dateStyle: 'medium', timeStyle: 'short' })
        : 'No date';
      const title = m.title || '<em style="color:#a0aec0">No title</em>';
      return `
        <div class="mention-item">
          <div class="mention-meta">
            <span class="badge">${m.source}</span>
            <span class="mention-date">${date}</span>
          </div>
          <div class="mention-title"><a href="${m.url}" target="_blank" rel="noopener">${title}</a></div>
          <div class="mention-content">${m.content}</div>
          <div class="mention-eng">👍 ${m.engagement.toLocaleString()} engagement</div>
        </div>`;
    }).join('');
  }

  function renderPagination(total) {
    const pages = Math.ceil(total / LIMIT);
    const current = Math.floor(offset / LIMIT) + 1;
    document.getElementById('page-info').textContent =
      total ? `Page ${current} of ${pages} (${total} results)` : '0 results';
    document.getElementById('prev-btn').disabled = offset === 0;
    document.getElementById('next-btn').disabled = offset + LIMIT >= total;
  }

  function prevPage() { offset = Math.max(0, offset - LIMIT); loadMentions(currentParams); }
  function nextPage() { offset += LIMIT; loadMentions(currentParams); }

  function search() {
    offset = 0;
    const params = {};
    const q      = document.getElementById('q-input').value.trim();
    const source = document.getElementById('source-input').value.trim();
    const from   = document.getElementById('from-input').value;
    const to     = document.getElementById('to-input').value;
    if (q)      params.q = q;
    if (source) params.source = source;
    if (from)   params.from = from;
    if (to)     params.to = to;
    loadMentions(params);
  }

  function reset() {
    offset = 0;
    document.getElementById('q-input').value = '';
    document.getElementById('source-input').value = '';
    document.getElementById('from-input').value = '';
    document.getElementById('to-input').value = '';
    loadMentions();
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  loadStats();
  loadMentions();
</script>
</body>
</html>
